services:
  backend:
    build:
      context: .
    command: uvicorn app.backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/models/best_mobilenet_v2.pth
      DATABASE_PATH: /app/logs/predictions.db
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads

  frontend:
    build:
      context: .
    command: streamlit run app/frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
